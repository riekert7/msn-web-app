<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Admin{% endblock %} — MiyaStudyNotes</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f4f6fb;
      color: #333;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .header-title { font-size: 18px; font-weight: 700; white-space: nowrap; }
    .header-user  { font-size: 13px; opacity: 0.85; word-break: break-all; }
    .logout-btn {
      padding: 8px 16px;
      border: 2px solid rgba(255,255,255,0.6);
      border-radius: 8px;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .logout-btn:hover { background: rgba(255,255,255,0.15); }

    /* ── Tab nav ── */
    .admin-nav {
      display: flex;
      align-items: stretch;
      padding: 0 24px;
      background: #fff;
      border-bottom: 1px solid #e9ecef;
      gap: 0;
    }
    .admin-nav-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 500;
      color: #666;
      text-decoration: none;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
    }
    .admin-nav-tab:hover { color: #667eea; }
    .admin-nav-tab.active {
      color: #667eea;
      font-weight: 700;
      border-bottom-color: #667eea;
    }
    .nav-badge {
      background: #e53e3e;
      color: #fff;
      border-radius: 999px;
      padding: 1px 7px;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.6;
    }

    /* ── Layout ── */
    .page { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }

    /* ── Banners ── */
    .banner {
      padding: 13px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 500;
    }
    .banner-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .banner-error   { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

    /* ── Card ── */
    .card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      margin-bottom: 28px;
      overflow: hidden;
    }
    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid #eee;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .card-header-meta { font-size: 12px; font-weight: 400; color: #999; }
    .card-body { padding: 20px; }

    /* ── Status badge ── */
    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .status-approved { background: #d4edda; color: #155724; }
    .status-pending  { background: #fff3cd; color: #856404; }
    .status-denied   { background: #f8d7da; color: #721c24; }
    .status-unknown  { background: #e9ecef; color: #6c757d; }

    /* ── Buttons ── */
    .btn {
      display: inline-block;
      padding: 7px 13px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s;
      white-space: nowrap;
      line-height: 1.4;
    }
    .btn:hover:not(:disabled) { opacity: 0.82; }
    .btn:disabled { cursor: not-allowed; opacity: 0.55; }
    .btn-approve      { background: #28a745; color: #fff; }
    .btn-deny         { background: transparent; color: #dc3545; border: 1.5px solid #dc3545; }
    .btn-reshare      { background: #667eea; color: #fff; }
    .btn-reshare-done { background: transparent; color: #667eea; border: 1.5px solid #667eea; }
    .btn-pop          { background: #f0f2ff; color: #667eea; border: 1.5px solid #c7cef7; }
    .btn-primary {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      padding: 12px 28px;
      font-size: 15px;
      border-radius: 10px;
      width: 100%;
    }

    /* ── Desktop table ── */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      text-align: left;
      padding: 10px 12px;
      background: #f8f9fa;
      font-weight: 600;
      color: #555;
      border-bottom: 2px solid #eee;
      white-space: nowrap;
    }
    thead th.sortable {
      cursor: pointer;
      user-select: none;
    }
    thead th.sortable:hover { background: #eef0f8; color: #667eea; }
    thead th.sort-active { color: #667eea; }
    .sort-icon { margin-left: 4px; font-size: 10px; opacity: 0.7; }
    tbody tr { border-bottom: 1px solid #f0f0f0; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fafbff; }
    tbody td { padding: 10px 12px; vertical-align: middle; }
    .actions-cell { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

    /* ── Mobile: stacked card layout ── */
    @media (max-width: 680px) {
      .table-wrap { overflow-x: visible; }
      table, thead, tbody, tr, td { display: block; width: 100%; }
      thead { display: none; }

      tbody tr {
        border: 1px solid #e9ecef;
        border-radius: 12px;
        margin-bottom: 12px;
        padding: 14px;
        background: #fff;
        box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      }
      tbody tr:hover { background: #fafbff; }

      tbody td {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 5px 0;
        border: none;
        font-size: 13px;
        gap: 8px;
      }

      tbody td::before {
        content: attr(data-label);
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: #999;
        flex-shrink: 0;
        min-width: 72px;
      }

      tbody td.col-name {
        font-size: 15px;
        font-weight: 700;
        border-bottom: 1px solid #f0f0f0;
        padding-bottom: 10px;
        margin-bottom: 4px;
        justify-content: space-between;
      }
      tbody td.col-name::before { display: none; }
      tbody td.col-date { color: #aaa; font-size: 11px; }

      tbody td.col-actions {
        border-top: 1px solid #f0f0f0;
        margin-top: 8px;
        padding-top: 12px;
        flex-direction: column;
        gap: 8px;
      }
      tbody td.col-actions::before { display: none; }
      tbody td.col-actions .actions-cell { width: 100%; gap: 8px; }
      tbody td.col-actions .btn {
        flex: 1;
        text-align: center;
        padding: 11px 8px;
        font-size: 13px;
      }

      .desktop-status-col { display: none !important; }

      .admin-nav { padding: 0 12px; }
      .admin-nav-tab { font-size: 13px; padding: 10px 12px; }
    }

    /* ── POP modal ── */
    .pop-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .pop-overlay.open { display: flex; }
    .pop-modal {
      background: #fff;
      border-radius: 14px;
      width: 100%;
      max-width: 700px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .pop-modal-header {
      padding: 14px 18px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .pop-modal-title { font-size: 14px; font-weight: 700; color: #333; }
    .pop-modal-close {
      background: none; border: none; font-size: 22px; cursor: pointer;
      color: #999; line-height: 1; padding: 2px 6px; border-radius: 6px; flex-shrink: 0;
    }
    .pop-modal-close:hover { background: #f0f0f0; color: #333; }
    .pop-modal-body {
      flex: 1; overflow: auto; display: flex;
      align-items: center; justify-content: center;
      background: #f8f9fa; min-height: 200px;
    }
    .pop-modal-body img { max-width: 100%; max-height: 70vh; object-fit: contain; display: block; }
    .pop-modal-body iframe { width: 100%; height: 70vh; border: none; }
    .pop-loading, .pop-error { padding: 40px; text-align: center; color: #999; font-size: 14px; }
    .pop-error { color: #721c24; }
    .pop-modal-footer { padding: 12px 18px; border-top: 1px solid #eee; }
    .btn-open-tab {
      background: #f0f2ff; color: #667eea; border: 1.5px solid #c7cef7;
      padding: 8px 16px; font-size: 13px; font-weight: 600; border-radius: 8px;
      cursor: pointer; text-decoration: none; white-space: nowrap; display: inline-block;
    }

    .empty { padding: 40px; text-align: center; color: #aaa; font-size: 14px; }

    {% block extra_styles %}{% endblock %}
  </style>
</head>
<body>

<header class="header">
  <div>
    <div class="header-title">MiyaStudyNotes Admin</div>
    <div class="header-user">{{ admin_email }}</div>
  </div>
  <a href="/admin/logout" class="logout-btn">Sign out</a>
</header>

<nav class="admin-nav">
  <a href="/admin/submissions"
     class="admin-nav-tab {% if active_tab == 'submissions' %}active{% endif %}">
    Submissions
    {% if pending_count %}
      <span class="nav-badge">{{ pending_count }}</span>
    {% endif %}
  </a>
  <a href="/admin/share"
     class="admin-nav-tab {% if active_tab == 'share' %}active{% endif %}">
    Direct Share
  </a>
</nav>

{% block content %}{% endblock %}

<!-- POP modal -->
<div class="pop-overlay" id="popOverlay" onclick="closePop(event)">
  <div class="pop-modal">
    <div class="pop-modal-header">
      <span class="pop-modal-title" id="popTitle">Proof of payment</span>
      <button class="pop-modal-close" onclick="closePop()">&times;</button>
    </div>
    <div class="pop-modal-body" id="popBody">
      <div class="pop-loading">Loading…</div>
    </div>
    <div class="pop-modal-footer">
      <a class="btn-open-tab" id="popOpenTab" href="#" target="_blank" rel="noopener">Open in new tab</a>
    </div>
  </div>
</div>

<script>
  function openPop(submissionId, name) {
    const url = `/admin/view-payment/${submissionId}`;
    document.getElementById('popTitle').textContent = `Proof of payment — ${name}`;
    document.getElementById('popOpenTab').href = url;
    document.getElementById('popBody').innerHTML = '<div class="pop-loading">Loading…</div>';
    document.getElementById('popOverlay').classList.add('open');
    document.body.style.overflow = 'hidden';

    fetch(url, { method: 'HEAD' })
      .then(res => {
        if (!res.ok) throw new Error(res.status === 404 ? 'No proof of payment on file for this submission.' : `Server error ${res.status}`);
        const ct = res.headers.get('content-type') || '';
        const body = document.getElementById('popBody');
        body.innerHTML = ct.startsWith('image/')
          ? `<img src="${url}" alt="Proof of payment" />`
          : `<iframe src="${url}" title="Proof of payment"></iframe>`;
      })
      .catch(err => {
        document.getElementById('popBody').innerHTML = `<div class="pop-error">${err.message}</div>`;
      });
  }

  function closePop(event) {
    if (event && event.target !== document.getElementById('popOverlay') && !event.currentTarget.classList?.contains('pop-modal-close')) return;
    document.getElementById('popOverlay').classList.remove('open');
    document.getElementById('popBody').innerHTML = '<div class="pop-loading">Loading…</div>';
    document.body.style.overflow = '';
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      document.getElementById('popOverlay').classList.remove('open');
      document.body.style.overflow = '';
    }
  });

  {% block scripts %}{% endblock %}
</script>

</body>
</html>
