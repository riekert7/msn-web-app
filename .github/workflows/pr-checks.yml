name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  # -----------------------------------------------------------------------
  # Tests — blocks merge on failure
  # -----------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-flask
      - name: Run tests
        run: pytest tests/ -v

  # -----------------------------------------------------------------------
  # Lint (ruff) — warns only, does not block merge
  # -----------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check .

  # -----------------------------------------------------------------------
  # Security — blocks merge on findings
  # -----------------------------------------------------------------------
  security:
    name: Security (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security tools
        run: pip install bandit pip-audit
      - name: bandit — static security scan
        run: bandit -r . -ll --exclude .venv,tests
      - name: pip-audit — dependency CVE scan
        run: pip-audit -r requirements.txt
